[project]
name = "goit-pythonweb-hw-10"
version = "0.1.0"
description = "Simple contact list"
authors = [
    {name = "dvankevich",email = "dvankevich@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11,<4.0"
dependencies = [
    "fastapi[standard] (>=0.136.0,<0.137.0)",
    "sqlalchemy (>=2.0.49,<3.0.0)",
    "alembic (>=1.18.4,<2.0.0)",
    "pydantic-settings[dotenv] (>=2.14.0,<3.0.0)",
    "psycopg2 (>=2.9.12,<3.0.0)",
    "python-jose[cryptography] (>=3.5.0,<4.0.0)",
    "passlib[bcrypt] (>=1.7.4,<2.0.0)",
    "python-dotenv (>=1.2.2,<2.0.0)",
    "libgravatar (>=1.0.4,<2.0.0)",
    "asyncpg (>=0.31.0,<0.32.0)",
    "slowapi (>=0.1.9,<0.2.0)",
    "fastapi-mail (>=1.6.2,<2.0.0)",
    "cloudinary (>=1.44.2,<2.0.0)",
    "redis (>=7.4.0,<8.0.0)",
    "pytest (>=9.0.3,<10.0.0)",
    "pytest-asyncio (>=1.3.0,<2.0.0)",
    "pytest-cov (>=7.1.0,<8.0.0)",
    "aiosqlite (>=0.22.1,<0.23.0)"
]


[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
pythonpath = ["."]
